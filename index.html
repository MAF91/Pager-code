<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فك شفرة البيجر</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23050805%22/%3E%3Crect x=%228%22 y=%2212%22 width=%2248%22 height=%2240%22 rx=%228%22 fill=%22%232A2E2A%22 stroke=%22%233DFF3D%22 stroke-width=%222%22/%3E%3Crect x=%2213%22 y=%2217%22 width=%2238%22 height=%2220%22 rx=%223%22 fill=%22%23050805%22/%3E%3Crect x=%2217%22 y=%2222%22 width=%2222%22 height=%223.5%22 rx=%221.7%22 fill=%22%233DFF3D%22/%3E%3Crect x=%2217%22 y=%2229%22 width=%2214%22 height=%223.5%22 rx=%221.7%22 fill=%22%233DFF3D%22/%3E%3Crect x=%2213%22 y=%2241%22 width=%2210%22 height=%226%22 rx=%222%22 fill=%22%230B100B%22 stroke=%22%233DFF3D%22/%3E%3Crect x=%2227%22 y=%2241%22 width=%2210%22 height=%226%22 rx=%222%22 fill=%22%233DFF3D%22/%3E%3Crect x=%2241%22 y=%2241%22 width=%2210%22 height=%226%22 rx=%222%22 fill=%22%230B100B%22 stroke=%22%233DFF3D%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#C8D0C5;--mute:#4B554A;--ink:#1B221A;--line:#9AA797;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0C0A;--mute:#8E9A8C;--ink:#E3EAE1;--line:#273026}}
:root[data-theme="dark"]{--bg:#0A0C0A;--mute:#8E9A8C;--ink:#E3EAE1;--line:#273026}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:10px 14px 24px}
/* pager body */
.pager{background:#222522;border:3px solid #3A3E3A;border-radius:26px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.bar{display:flex;justify-content:space-between;gap:10px;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:.8rem;color:#3DFF3D;background:#050805;border:1px solid #1E4A1E;border-bottom:0;border-radius:12px 12px 0 0;padding:6px 12px;direction:ltr}
.screen{background:#050805;border:1px solid #1E4A1E;border-radius:0 0 12px 12px;padding:14px 16px 16px;color:#5CFF5C;background-image:repeating-linear-gradient(0deg,rgba(61,255,61,.035) 0 1px,transparent 1px 3px)}
h1{font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.3;margin:0 0 12px;font-weight:700;color:#3DFF3D}
.credit{margin:0 0 12px;color:#38B838;font-size:.95rem}
.credit a{color:#6DFF6D;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.credit a:focus-visible{outline:2px solid #3DFF3D;outline-offset:2px;border-radius:4px}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid #1F6B1F;background:#000;color:#6DFF6D;caret-color:#3DFF3D;border-radius:8px;padding:12px;font:inherit;font-size:1.15rem}
textarea::placeholder{color:#2E8A2E}
textarea:focus-visible,button:focus-visible{outline:2px solid #3DFF3D;outline-offset:2px}
.hint{color:#38B838;font-size:.88rem;margin:6px 2px 16px}
.out{margin:12px 0 0}
output{display:block;text-align:right;font-family:"Tajawal",system-ui,sans-serif;font-weight:500;font-size:2rem;line-height:1.6;word-break:break-word;min-height:60px;padding:12px;background:#071207;border:1px solid #1F6B1F;border-radius:8px;color:#8DFF8D}
output:empty::before{content:"الجملة تظهر هنا";color:#2E8A2E;font-size:1.1rem}
.toggle{margin:12px 0 10px;border:1px solid #2F6B2F;background:#0B100B;color:#6DFF6D;font:inherit;font-weight:700;padding:9px 16px;border-radius:7px;cursor:pointer}
.map[hidden]{display:none}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.note{color:#38B838;font-size:.9rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px;margin:0;padding:0;list-style:none}
.map li{background:#071207;border:1px solid #1B4A1B;border-radius:6px;text-align:center;padding:4px 0}
.map span{display:block;color:#38B838;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:.78rem;line-height:1.3}
.map b{font-size:1.45rem;line-height:1.3;color:#6DFF6D}
/* pager keys */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keys button{border:1px solid #2F6B2F;background:#0B100B;color:#6DFF6D;font:inherit;font-weight:700;font-size:.95rem;padding:13px 4px;border-radius:7px;cursor:pointer}
.keys button[aria-pressed="true"]{background:#3DFF3D;color:#031003;border-color:#3DFF3D}
.keys button:active{transform:translateY(1px)}
footer{margin:14px 0 0;text-align:center;color:var(--mute)}
footer a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:#3DFF3D;text-decoration-thickness:3px;text-underline-offset:4px}
footer a:focus-visible{outline:3px solid #3DFF3D;outline-offset:3px;border-radius:4px}
@media (max-width:420px){main{padding:8px 10px 20px}.pager{padding:9px;border-radius:22px}output{font-size:1.6rem}.keys button{font-size:.82rem;padding:12px 2px}.map{grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}}
@media (min-width:768px){main{max-width:1100px;padding:16px 32px 28px}body{font-size:1.1rem}textarea{min-height:110px;font-size:1.3rem}output{font-size:2.4rem;min-height:80px}.map{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.map b{font-size:1.7rem}.keys button{font-size:1.05rem;padding:15px 6px}}
@media (min-width:1200px){main{max-width:1320px}.map{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}}
@media (min-width:768px) and (max-height:720px){main{padding:8px 32px 12px}h1{font-size:1.9rem;margin:0 0 8px}textarea{min-height:80px}output{min-height:64px;font-size:2rem}.screen{padding:10px 16px 12px}.keys{margin-top:8px}.keys button{padding:11px 6px}.toggle{margin:8px 0 6px}footer{margin:8px 0 0;font-size:.95rem}}
</style>
</head>
<body>
<main>
  
  <div class="pager">
    <div class="bar"><span>PAGER-01</span><span>SIG ▂▄▆█ · 68%</span></div>
    <div class="screen">
      <h1>فك شفرة البيجر</h1>
      

      <label for="inp" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">النص</label>
      <textarea id="inp"></textarea>
      

      <div class="out"><output id="res" aria-live="polite"></output></div>

      <div class="row"><button class="toggle" id="showMap" aria-expanded="false">إظهار الحروف</button><span class="note" id="note" hidden>الأرقام تكتب بين قوسين بعد التشفير</span></div>
      <ul class="map" id="map" hidden></ul>
    </div>
    <div class="keys">
      <button id="tabEnc" aria-pressed="false">تشفير</button>
      <button id="tabDec" aria-pressed="true">فك الشفرة</button>
      <button id="copy">نسخ النتيجة</button>
    </div>
  </div>

  
<footer>أُنشئ بواسطة <a href="https://twitter.com/alhusen_91" target="_blank" rel="noopener noreferrer">MAF</a><br>حسابي على تويتر: <a href="https://twitter.com/alhusen_91" target="_blank" rel="noopener noreferrer" dir="ltr">@alhusen_91</a></footer>
</main>

<script>
const L="ابتثجحخدذرزسشصضطظعغفقكلمنهوي".split("");
const norm={"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ة":"ه","ى":"ي","ؤ":"و","ئ":"ي"};
let mode="dec";
const $=id=>document.getElementById(id);
const inp=$("inp"),res=$("res");

$("map").innerHTML=L.map((c,i)=>`<li><span>${i+1}</span><b>${c}</b></li>`).join("");

function digits(s){return s.replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776)}

function decode(){
  const lines=digits(inp.value).split(/[\/|\n]+/).map(l=>l.trim()).filter(Boolean);
  res.textContent=lines.map(line=>(line.match(/\[[^\]]*\]|[^\s,،\-–_.\[\]]+/g)||[]).map(t=>{if(t[0]==="["){return t.slice(1,-1)}
    const n=parseInt(t,10);
    return /^\d+$/.test(t)&&n>=1&&n<=28?L[n-1]:"؟";
  }).join("")).join(" ");
}

function encode(){
  const words=digits(inp.value).replace(/[\u064B-\u065F\u0640]/g,"").split(/\s+/).filter(Boolean);
  res.textContent=words.map(w=>{
    const out=[];let lit="";
    const flush=()=>{if(lit){out.push("["+lit+"]");lit=""}};
    for(const ch of w){const i=L.indexOf(norm[ch]||ch);if(i>=0){flush();out.push(String(i+1))}else{lit+=ch}}
    flush();
    return out.join(" ");
  }).filter(Boolean).join(" / ");
}

function run(){mode==="dec"?decode():encode()}

function setMode(m){
  mode=m;res.dir=m==="dec"?"rtl":"ltr";$("note").hidden=m!=="enc";
  $("tabDec").setAttribute("aria-pressed",m==="dec");
  $("tabEnc").setAttribute("aria-pressed",m==="enc");
  
  inp.value="";run();
}
$("tabDec").onclick=()=>setMode("dec");
$("tabEnc").onclick=()=>setMode("enc");
inp.addEventListener("input",run);
$("showMap").onclick=()=>{const m=$("map"),b=$("showMap"),open=m.hidden;m.hidden=!open;b.setAttribute("aria-expanded",open);b.textContent=open?"إخفاء الحروف":"إظهار الحروف"};

$("copy").onclick=async()=>{
  const b=$("copy");
  try{await navigator.clipboard.writeText(res.textContent);b.textContent="تم النسخ"}
  catch(e){b.textContent="تعذر النسخ"}
  setTimeout(()=>b.textContent="نسخ النتيجة",1500);
};
run();
</script>
</body>
</html>
